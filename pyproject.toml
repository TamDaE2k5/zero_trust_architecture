[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-trust-abac"
version = "4.0.0"
description = "Request-time policy decision research simulation"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.3", "httpx==0.28.1", "pydantic==2.11.5", "streamlit==1.45.1", "pytest==8.3.5", "matplotlib==3.10.3", "ruff==0.11.13"]
optional-dependencies.gateway = ["PyJWT==2.10.1", "cryptography==46.0.3", "psycopg[binary]==3.2.10", "psycopg-pool==3.2.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

