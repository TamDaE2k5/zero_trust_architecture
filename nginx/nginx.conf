# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION (ZERO TRUST ARCHITECTURE PEP)
# Cổng kiểm soát truy cập và xác thực mTLS vành đai (Network Edge)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    # --------------------------------------------------------------------------
    # 1. BẢO VỆ CHỐNG DÒ QUÉT MẬT KHẨU (RATE LIMITING)
    # Giới hạn tối đa 5 yêu cầu/phút trên mỗi địa chỉ IP cho endpoint /auth/login
    # --------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;

    server {
        listen 443 ssl;
        server_name _;

        # ----------------------------------------------------------------------
        # 2. BẢO MẬT TẦNG VẬN CHUYỂN & XÁC THỰC HAI CHIỀU (mTLS x509)
        # Chứng chỉ máy chủ do Root CA nội bộ cấp
        # ----------------------------------------------------------------------
        ssl_certificate     /etc/gateway/tls/server.crt;
        ssl_certificate_key /etc/gateway/tls/server.key;

        # Root CA nội bộ dùng để thẩm định chứng chỉ của máy khách (Client Certificate)
        ssl_client_certificate /etc/gateway/tls/ca.crt;

        # 'optional': Cho phép kết nối ban đầu để hiển thị giao diện Web hoặc trả
        # lỗi chi tiết từ Gateway PEP, đồng thời xác minh chứng chỉ nếu có gửi lên.
        ssl_verify_client optional;

        # Bắt buộc chỉ sử dụng các phiên bản TLS hiện đại và an toàn
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # Giới hạn kích thước body tối đa 8KB để ngăn ngừa tấn công tràn bộ đệm / DoS
        client_max_body_size 8k;

        # Tự động chuyển hướng sang HTTPS nếu người dùng vô tình nhập http://
        error_page 497 =301 https://$http_host$request_uri;

        # Kích hoạt tiêu đề HTTP Strict Transport Security (HSTS)
        add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

        # ----------------------------------------------------------------------
        # 3. ĐIỀU PHỐI ĐĂNG NHẬP (/auth/login) CÓ RATE LIMITING
        # ----------------------------------------------------------------------
        location = /auth/login {
            limit_req zone=login burst=10 nodelay;
            include /etc/gateway/tls/proxy-headers.conf;
            proxy_pass http://gateway:8000;
        }

        # ----------------------------------------------------------------------
        # 4. CHUYỂN TIẾP TẤT CẢ REQUEST TỚI FASTAPI GATEWAY NỘI BỘ
        # ----------------------------------------------------------------------
        location / {
            include /etc/gateway/tls/proxy-headers.conf;
            proxy_pass http://gateway:8000;
        }
    }
}
