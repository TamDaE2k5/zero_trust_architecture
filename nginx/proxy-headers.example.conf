# ==============================================================================
# PROXY HEADERS CONFIGURATION (ZERO TRUST ARCHITECTURE)
# Chèn các tiêu đề xác thực an ninh từ Nginx Reverse Proxy sang Gateway PEP
# ==============================================================================

# 1. Mã bí mật chia sẻ chung giữa Nginx và Gateway:
# Ngăn chặn kẻ tấn công đi tắt kết nối trực tiếp vào Gateway mà không qua Nginx Proxy.
proxy_set_header X-Gateway-Proxy-Secret "<YOUR_32_BYTE_HEX_PROXY_SECRET>";

# 2. Địa chỉ IP máy khách thực tế:
# Lấy trực tiếp từ Socket kết nối TCP ($remote_addr), không thể bị giả mạo.
proxy_set_header X-Gateway-Client-IP $remote_addr;

# 3. Kết quả xác minh chứng chỉ máy khách mTLS:
# Trả về 'SUCCESS', 'FAILED:reason', hoặc 'NONE'
proxy_set_header X-Gateway-Device-Verified $ssl_client_verify;

# 4. Số Serial định danh của chứng chỉ máy khách mTLS:
# Phục vụ cơ chế Hardware Token Binding (RFC 8705)
proxy_set_header X-Gateway-Device-Serial $ssl_client_serial;

# 5. Xóa bỏ tiêu đề X-Forwarded-For:
# Triệt tiêu nguy cơ IP Spoofing qua header giả mạo từ người dùng.
proxy_set_header X-Forwarded-For "";

# 6. Thiết lập Host và Timeout an toàn
proxy_set_header Host $host;
proxy_connect_timeout 3s;
proxy_read_timeout 10s;
